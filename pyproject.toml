[project]
name = "django-agent-content"
version = "0.2.0"
description = "Django app that lets AI agents and MCP clients (Claude Code, Cursor and others) edit your site's content safely: API keys, permissions, drafts, file and image uploads, no deletes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sushan Poudel" }]
requires-python = ">=3.10"
dependencies = ["Django>=4.2"]
keywords = [
    "django", "mcp", "model context protocol", "ai agents", "llm", "claude", "cms",
    "content api", "headless cms", "django admin", "api keys", "file upload", "image upload",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/hexa01/django-agent-content"
Documentation = "https://github.com/hexa01/django-agent-content#readme"
Changelog = "https://github.com/hexa01/django-agent-content/blob/main/CHANGELOG.md"
Issues = "https://github.com/hexa01/django-agent-content/issues"
"MCP server" = "https://github.com/hexa01/agent-content-mcp"
Author = "https://sushanpoudel.com"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "agent_content" }]
